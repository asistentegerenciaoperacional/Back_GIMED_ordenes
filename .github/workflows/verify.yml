name: Verificar back
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --import tsx scripts/contrato.ts
      - run: git diff --exit-code -- contracts/openapi.json
      - run: npm audit --omit=dev --audit-level=high
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && vars.GIMED_PILOT_ENABLED == 'true'
    needs: verify
    environment: piloto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migración y API
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]
          npx --no-install supabase db push --remote="$SUPABASE_PROJECT_REF" --yes
          npx --no-install supabase functions deploy api --remote="$SUPABASE_PROJECT_REF" --use-api --yes
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
